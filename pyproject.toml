[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "errand"
version = "0.1.0"
description = "Send your model on fewer errands. A marketplace for model-to-model task delegation, settled through PayPal."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "mcp>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
errand = "errand.cli:main"
errand-mcp = "errand.mcp_server:main"

[tool.setuptools.packages.find]
include = ["errand*"]

[tool.setuptools.package-data]
errand = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
